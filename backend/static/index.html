<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
        <h1 class="text-3xl font-extrabold text-center mb-2 bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
            URL Shortener
        </h1>
        <p class="text-slate-400 text-center text-sm mb-6">Transform long links into lightning-fast short codes.</p>

        <!-- Shorten Form -->
        <form id="shortenForm" class="space-y-4">
            <div>
                <label for="urlInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Paste your long URL</label>
                <input 
                    type="url" 
                    id="urlInput" 
                    required 
                    placeholder="https://example.com/very/long/link" 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-100 placeholder-slate-500 text-sm transition"
                >
            </div>
            <button 
                type="submit" 
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-semibold rounded-lg text-white shadow-lg transition duration-200 cursor-pointer"
            >
                Shorten URL
            </button>
        </form>

        <!-- Result Box (Hidden by default) -->
        <div id="resultBox" class="hidden mt-6 p-4 bg-slate-900/50 border border-slate-700/60 rounded-xl space-y-3">
            <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Success! Here is your short link:</span>
            <div class="flex items-center justify-between bg-slate-900 p-3 rounded-lg border border-slate-700">
                <a id="shortLinkAnchor" href="#" target="_blank" class="text-blue-400 hover:underline text-sm truncate mr-2 font-mono"></a>
                <button 
                    onclick="copyToClipboard()" 
                    class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded border border-slate-600 transition"
                >
                    Copy
                </button>
            </div>
        </div>

        <!-- Error Box (Hidden by default) -->
        <div id="errorBox" class="hidden mt-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-lg text-rose-400 text-xs"></div>
    </div>

    <!-- Frontend Script -->
    <script>
        const form = document.getElementById('shortenForm');
        const urlInput = document.getElementById('urlInput');
        const resultBox = document.getElementById('resultBox');
        const shortLinkAnchor = document.getElementById('shortLinkAnchor');
        const errorBox = document.getElementById('errorBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            resultBox.classList.add('hidden');

            const longUrl = urlInput.value.trim();

            try {
                const response = await fetch('/shorten/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: longUrl })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Failed to shorten URL');
                }

                const data = await response.json();
                
                // Populate and show result
                shortLinkAnchor.href = data.short_url;
                shortLinkAnchor.textContent = data.short_url;
                resultBox.classList.remove('hidden');

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            }
        });

        function copyToClipboard() {
            const urlText = shortLinkAnchor.href;
            navigator.clipboard.writeText(urlText).then(() => {
                event.target.textContent = 'Copied!';
                setTimeout(() => {
                    event.target.textContent = 'Copy';
                }, 2000);
            });
        }
    </script>
</body>
</html>
