<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-8">

    <!-- Main Container: Relative to Viewport (Max 90vh on desktop, flexes gracefully) -->
    <div class="w-full max-w-7xl grid grid-cols-1 md:grid-cols-4 gap-6 h-auto md:h-[90vh]">

        <!-- LEFT 2/3: URL Shortener & Session History -->
        <div class="md:col-span-3 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col h-full overflow-hidden">
            <div class="flex-shrink-0">
                <h1 class="text-3xl font-extrabold mb-2 bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                    URL Shortener
                </h1>
                <p class="text-slate-400 text-sm mb-6">Transform long links into lightning-fast short codes.</p>

                <!-- Shorten Form -->
                <form id="shortenForm" class="space-y-4">
                    <div>
                        <label for="urlInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Paste your long URL</label>
                        <input 
                            type="url" 
                            id="urlInput" 
                            required 
                            placeholder="https://example.com/very/long/link" 
                            class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-100 placeholder-slate-500 text-sm transition"
                        >
                    </div>
                    <button 
                        type="submit" 
                        class="w-full py-3 bg-slate-600 hover:bg-teal-500 font-semibold rounded-lg text-white shadow-lg transition duration-200 cursor-pointer"
                    >
                        Shorten URL
                    </button>
                </form>

                <!-- Error Box (Hidden by default) -->
                <div id="errorBox" class="hidden mt-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-lg text-rose-400 text-xs"></div>
            </div>

            <!-- Session History Container (Fills remaining relative space & scrolls independently) -->
            <div id="historyContainer" class="hidden mt-6 flex flex-col flex-grow overflow-hidden">
                <div class="flex items-center justify-between mb-2 flex-shrink-0">
                    <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">your recent short urls</span>
                </div>
                <!-- Scrollable list container -->
                <div id="linksList" class="space-y-3 overflow-y-auto pr-2 flex-grow"></div>
            </div>
        </div>

        <!-- RIGHT 1/3: Login Box -->
        <div class="md:col-span-1 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col h-full">
            <h2 class="text-xl font-bold mb-1 text-slate-100">Account</h2>
            <p class="text-slate-400 text-xs mb-6">Sign in to manage your custom links.</p>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="usernameInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Username</label>
                    <input 
                        type="text" 
                        id="usernameInput" 
                        required 
                        placeholder="Username" 
                        class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-100 placeholder-slate-500 text-sm transition"
                    >
                </div>
                <div>
                    <label for="passwordInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                    <input 
                        type="password" 
                        id="passwordInput" 
                        required 
                        placeholder="Password" 
                        class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-100 placeholder-slate-500 text-sm transition"
                    >
                </div>
                <button 
                    type="submit" 
                    class="w-full py-2.5 bg-slate-700 hover:bg-blue-600 font-semibold rounded-lg text-white shadow transition duration-200 text-sm cursor-pointer"
                >
                    Sign In
                </button>
            </form>

            <!-- Login Status Feedback (Hidden by default) -->
            <div id="loginStatus" class="hidden mt-4 p-3 rounded-lg text-xs text-center"></div>
        </div>

    </div>
    <!-- External Frontend Script -->
    <script src="/static/script.js"></script>
</body>
</html>
