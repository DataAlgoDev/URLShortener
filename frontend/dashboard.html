<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-8">

    <!-- Main Container -->
    <div class="w-full grid grid-cols-1 md:grid-cols-4 gap-6 h-auto md:h-[90vh]">

        <!-- LEFT 3/4: URL Shortener & Session History -->
        <div class="md:col-span-2 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col h-full overflow-hidden">
            <div class="flex-shrink-0">
                <h1 class="text-3xl font-extrabold mb-2 bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                    URL Shortener
                </h1>
                <p class="text-slate-400 text-sm mb-6">Transform long links into lightning-fast short codes.</p>

                <!-- Shorten Form -->
                <form id="UserShortenForm" class="space-y-4">
                    <div>
                        <label for="urlInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Paste your long URL</label>
                        <input 
                            type="url" 
                            id="urlInput" 
                            required 
                            placeholder="https://example.com/very/long/link" 
                            class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-100 placeholder-slate-500 text-sm transition"
                        >
                    </div>
                    <button 
                        type="submit"
                        class="w-full py-3 bg-slate-600 hover:bg-teal-500 font-semibold rounded-lg text-white shadow-lg transition duration-200 cursor-pointer"
                    >
                        Shorten URL
                    </button>
                </form>

                <!-- Error Box -->
                <div id="errorBox" class="hidden mt-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-lg text-rose-400 text-xs"></div>
            </div>

            <!-- Session History Container -->
            <div id="historyContainer" class="hidden mt-6 flex flex-col flex-grow overflow-hidden">
                <div class="flex items-center justify-between mb-2 flex-shrink-0">
                    <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">your recent short urls</span>
                </div>
                <div id="linksList" class="space-y-3 overflow-y-auto pr-2 flex-grow"></div>
            </div>
        </div>

        <!-- RIGHT: Account Box (Full Height Flex applied) -->
        <div class="md:col-span-2 bg-slate-800 p-3 rounded-2xl shadow-xl border border-slate-700 flex flex-col h-full overflow-hidden">
            <!-- Header Row -->
            <div class="flex items-center justify-between mb-4 flex-shrink-0 p-3">
                <h2 class="text-xl font-bold text-slate-100">Account : <span id="accountUsername" class="text-blue-400 font-mono">Loading...</span></h2>
                <button 
                    id="logoutBtn"
                    class="px-4 py-2 bg-rose-300/20 hover:bg-rose-800/30 text-rose-400 border border-rose-500/30 rounded-lg text-xs font-semibold transition cursor-pointer"
                >
                    Logout
                </button>
            </div>

            <!-- Account Details Area (Stretches to fill remaining vertical space) -->
            <div class="space-y-2 text-sm text-slate-300 flex flex-col flex-grow overflow-hidden">
                <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold flex-shrink-0">User Data Profile</p>
                <div id="userDataBox" class="bg-slate-900 p-1 rounded-xl border border-slate-700 font-mono text-xs text-slate-300 flex flex-col flex-grow overflow-hidden">
                    <span class="text-slate-500 p-3">Fetching user information...</span>
                </div>
            </div>
        </div>

    </div>

    <!-- External Frontend Script -->
    <script src="/static/script.js"></script>
</body>
</html>
